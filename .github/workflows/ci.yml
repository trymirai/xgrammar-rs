name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly fmt --all -- --check
      - run: cargo clippy -p xgrammar-rs --all-targets --features tokenizers -- -D warnings
      - run: cargo doc -p xgrammar-rs --no-deps --features tokenizers

  # Ported upstream C++ gtest suite (external/xgrammar/tests/cpp/) on the same OS matrix.
  rust-tests:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-14
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p xgrammar-rs --locked
      - run: cargo test -p xgrammar-rs --locked --features tokenizers --test rust_api

  targets:
    name: Core target (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-ios
          - os: macos-14
            target: aarch64-apple-ios-sim
          - os: ubuntu-latest
            target: wasm32-unknown-unknown
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo check -p xgrammar-rs --locked --target ${{ matrix.target }}

  bindings:
    name: Generated binding backends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: cargo check -p xgrammar-py --locked --no-default-features --features bindings-pyo3
      - run: cargo check -p xgrammar-py --locked --no-default-features --features bindings-napi
      - run: cargo check -p xgrammar-py --locked --no-default-features --features bindings-uniffi
      - run: cargo check -p xgrammar-py --locked --target wasm32-unknown-unknown --no-default-features --features bindings-wasm

  # Untouched upstream Python suite (external/xgrammar/tests/python) against our Rust extension.
  # Matrix mirrors mlc-ai/xgrammar `.github/workflows/unit_test.yaml`.
  python-tests:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-14, macos-15-intel]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
        exclude:
          - os: macos-14
            python: "3.14t"
          - os: macos-15-intel
            python: "3.13"
          - os: macos-15-intel
            python: "3.14"
          - os: macos-15-intel
            python: "3.14t"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout upstream XGrammar reference
        shell: bash
        run: |
          set -euo pipefail
          REV="$(grep -v '^#' xgrammar.rev | head -n1 | tr -d '[:space:]')"
          mkdir -p external
          git clone https://github.com/mlc-ai/xgrammar.git external/xgrammar
          git -C external/xgrammar checkout "$REV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-${{ matrix.os }}-${{ matrix.python }}

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Cache Hugging Face hub
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
          key: huggingface-${{ matrix.os }}-python-${{ matrix.python }}

      - name: Build and install the mixed Rust/Python package
        shell: bash
        run: |
          set -euo pipefail
          extras=(--extra test)
          # Match upstream: MLX optional on macOS arm64 (skip free-threaded).
          if [ "${{ matrix.os }}" = "macos-14" ] && [[ "${{ matrix.python }}" != *t ]]; then
            extras+=(--extra metal)
          fi
          uv sync --project bindings/python "${extras[@]}"

      - name: Run upstream Python suite
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DOWNLOAD_TIMEOUT: 60
        run: |
          set -euo pipefail
          # Same gate as upstream unit_test.yaml: full suite when token is present.
          if [ -n "${HF_TOKEN:-}" ]; then
            uv run --project bindings/python python -m pytest external/xgrammar/tests/python
          else
            uv run --project bindings/python python -m pytest external/xgrammar/tests/python \
              -m "not hf_token_required"
          fi

      - name: Run suite under pytest-run-parallel (free-threaded)
        if: matrix.python == '3.14t'
        shell: bash
        env:
          PYTHON_GIL: 0
        run: |
          set -euo pipefail
          uv run --project bindings/python --with pytest-run-parallel python -m pytest \
            external/xgrammar/tests/python -m "not hf_token_required" --parallel-threads=8
