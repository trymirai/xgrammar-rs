name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly fmt --all -- --check
      - run: cargo clippy -p xgrammar-rs --all-targets --features tokenizers -- -D warnings
      - run: cargo doc -p xgrammar-rs --no-deps --features tokenizers

  rust-tests:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-14
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p xgrammar-rs --locked
      - run: cargo test -p xgrammar-rs --locked --features tokenizers --test rust_api

  targets:
    name: Core target (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-ios
          - os: macos-14
            target: aarch64-apple-ios-sim
          - os: ubuntu-latest
            target: wasm32-unknown-unknown
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo check -p xgrammar-rs --locked --target ${{ matrix.target }}

  bindings:
    name: Generated binding backends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: cargo check -p xgrammar-py --locked --no-default-features --features bindings-pyo3
      - run: cargo check -p xgrammar-py --locked --no-default-features --features bindings-napi
      - run: cargo check -p xgrammar-py --locked --no-default-features --features bindings-uniffi
      - run: cargo check -p xgrammar-py --locked --target wasm32-unknown-unknown --no-default-features --features bindings-wasm

  upstream-python:
    name: Untouched upstream Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout upstream XGrammar reference
        run: |
          set -euo pipefail
          REV="$(grep -v '^#' xgrammar.rev | head -n1 | tr -d '[:space:]')"
          mkdir -p external
          git clone https://github.com/mlc-ai/xgrammar.git external/xgrammar
          git -C external/xgrammar checkout "$REV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build and install the mixed Rust/Python package
        run: uv sync --project bindings/python --extra test
      - name: Run the original xgrammar suite without token-gated cases
        env:
          HF_HUB_DOWNLOAD_TIMEOUT: 60
        run: >-
          uv run --project bindings/python python -m pytest external/xgrammar/tests/python
          -m "not hf_token_required"

  upstream-python-hf:
    name: Upstream Python tests (HF-gated)
    runs-on: ubuntu-latest
    # Requires repo secret HF_TOKEN; skips cleanly when unset (forks/PRs).
    steps:
      - uses: actions/checkout@v4
      - name: Checkout upstream XGrammar reference
        run: |
          set -euo pipefail
          REV="$(grep -v '^#' xgrammar.rev | head -n1 | tr -d '[:space:]')"
          mkdir -p external
          git clone https://github.com/mlc-ai/xgrammar.git external/xgrammar
          git -C external/xgrammar checkout "$REV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build and install the mixed Rust/Python package
        run: uv sync --project bindings/python --extra test
      - name: Run HF-token-required upstream cases
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DOWNLOAD_TIMEOUT: 120
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret unset; skipping HF-gated suite"
            exit 0
          fi
          uv run --project bindings/python python -m pytest external/xgrammar/tests/python \
            -m hf_token_required -v --tb=line
