[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "xgrammar"
version = "0.3.0"
description = "Efficient, Flexible and Portable Structured Generation — pure-Rust XGrammar."
license = "Apache-2.0"
requires-python = ">=3.8,<4"
dependencies = [
    "pydantic",
    "torch>=1.10.0",
    "transformers>=4.38.0,<5",
    "triton; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "numpy",
    "typing-extensions>=4.9.0",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
readme = { file = "../../README.md", content-type = "text/markdown" }
authors = [{ name = "Eugene Bokhan", email = "eugenebokhan@gmail.com" }]
keywords = [
    "llm",
    "grammar",
    "structured-generation",
    "json-schema",
    "parser",
]

[project.optional-dependencies]
test = [
    "huggingface-hub[cli]",
    "protobuf",
    "pytest",
    "sentencepiece",
    "tiktoken",
    "ruff>=0.14.0",
]
metal = [
    # transformers >=5.13 breaks `import mlx_lm` (match upstream xgrammar).
    "mlx-lm; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "transformers<5.13; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://github.com/trymirai/xgrammar-rs"
Repository = "https://github.com/trymirai/xgrammar-rs"
Issues = "https://github.com/trymirai/xgrammar-rs/issues"

[tool.maturin]
module-name = "xgrammar.xgrammar_rs"
manifest-path = "../../crates/xgrammar-py/Cargo.toml"
features = ["bindings-pyo3"]
python-source = "."

[tool.ruff]
target-version = "py38"
line-length = 119

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "C408",
    "C901",
    "D",
    "EM101",
    "EM102",
    "ERA001",
    "FIX002",
    "F722",
    "FBT001",
    "FBT002",
    "N812",
    "PD008",
    "PGH003",
    "PLC0415",
    "PLR0904",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "PLR6301",
    "PLW0108",
    "PT",
    "PTH123",
    "RET503",
    "RET504",
    "RUF005",
    "S",
    "SIM108",
    "T20",
    "TD003",
    "TRY003",
    "CPY001",
    "COM812",
    "TC003",
]
