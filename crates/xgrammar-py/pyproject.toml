[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "xgrammar"
version = "0.3.0"
description = "PyO3 bindings for the pure-Rust xgrammar core."
requires-python = ">=3.8,<4"

[tool.maturin]
module-name = "xgrammar.xgrammar_rs"
manifest-path = "Cargo.toml"
features = ["bindings-pyo3"]
python-source = "../../bindings/python"
